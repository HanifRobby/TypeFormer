experiment:
  id: "f1_film_only"
  description: "FiLM head only: conditioning embedding on user statistics, raw cosine scoring"

scoring:
  method: "cosine"
  template: "centroid"

film:
  use_film: true
  stats_dim: 20
  embedding_dim: 64
  hidden_dim: 64
  dropout: 0.0
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4   # tuned on validation set
  max_epochs: 100
  patience: 10
  margin: 1.0
  batch_size: 256
  E_range: [2, 5, 7, 10]
  film_reg_lambda: 0.1   # identity regularisation: penalise ||gamma-1||^2 + ||beta||^2
